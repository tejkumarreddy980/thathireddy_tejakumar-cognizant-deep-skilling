<div 
  [ngClass]="cardClasses" 
  [ngStyle]="{ 'border-left': borderStyle }"
  style="border-top: 1px solid #ddd; border-right: 1px solid #ddd; border-bottom: 1px solid #ddd; padding: 1rem; border-radius: 6px; width: 240px;">
  
  <div style="display: flex; justify-content: space-between; align-items: start;">
    <h3 style="margin: 0 0 0.5rem 0; font-size: 1.1rem; color: #333;">{{ course.name }}</h3>
    
    <span [ngSwitch]="course.gradeStatus" style="font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; color: white;">
      <span *ngSwitchCase="'passed'" style="background: #28a745;">Passed</span>
      <span *ngSwitchCase="'failed'" style="background: #dc3545;">Failed</span>
      <span *ngSwitchDefault style="background: #6c757d;">Pending</span>
    </span>
  </div>

  <p style="margin: 0 0 0.25rem 0; color: #666; font-size: 0.9rem;">Code: <strong>{{ course.code }}</strong></p>
  <p style="margin: 0 0 1rem 0; color: #666; font-size: 0.9rem;">Credits: {{ course.credits | creditLabel }}</p>

  <div style="display: flex; gap: 0.5rem; align-items: center;">
    <button (click)="onEnroll()" style="background: #28a745; color: white; border: none; padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer;">
      {{ isEnrolled ? 'Unenroll' : 'Enroll' }}
    </button>
    <button (click)="viewDetails()" style="background: #6c757d; color: white; border: none; padding: 0.4rem 0.6rem; border-radius: 4px; cursor: pointer; font-size: 0.8rem;">
      Details
    </button>
  </div>
</div>
