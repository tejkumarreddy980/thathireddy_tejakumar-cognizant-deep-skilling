<div style="padding: 2rem; font-family: sans-serif; max-width: 700px;">
  <h2>Student Profile</h2>
  
  <div style="background: #f8f9fa; padding: 1rem; border-radius: 6px; margin-bottom: 1.5rem;">
    <p style="margin: 0.3rem 0;"><strong>Student Name:</strong> Suji</p>
    <p style="margin: 0.3rem 0;"><strong>Track:</strong> Java Full Stack Engineering</p>
  </div>

  <h3>My Enrolled Courses</h3>

  <div *ngIf="enrolledCourses.length > 0; else noEnrolled" style="display: flex; flex-direction: column; gap: 0.8rem;">
    <div *ngFor="let course of enrolledCourses" style="padding: 0.8rem 1rem; background: #e2f0d9; border-left: 4px solid #28a745; border-radius: 4px;">
      <strong>{{ course.name }}</strong> ({{ course.code }}) - {{ course.credits }} Credits
    </div>
  </div>

  <ng-template #noEnrolled>
    <p style="color: #777;">You have not enrolled in any courses yet. Visit the Courses page to enroll!</p>
  </ng-template>
</div>
